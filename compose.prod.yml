services:
  rest_api:
    container_name: rest_api
    image: drglasdou/rest_api:latest
    build:
      context: .
      dockerfile: dockerfile.prod
    restart: always
    env_file:
      - .env
    environment:
      PG_HOST: rest_api_pg
      REDIS_HOST: rest_api_redis
    ports:
      - "4000:4000"
    depends_on:
      rest_api_pg:
        condition: service_healthy
    networks:
      - rest_api_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
