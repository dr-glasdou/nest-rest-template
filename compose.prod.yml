services:
  rest_api:
    container_name: rest_api
    image: drglasdou/rest_api:latest
    build:
      context: .
      dockerfile: dockerfile.prod
    restart: always
    env_file:
      - .env
    environment:
      PORT: ${PORT:-4000}
      STAGE: ${STAGE:-prod}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-Abcd@1234}
      PG_DB: ${PG_DB:-rest_api_db}
      PG_HOST: ${PG_HOST:-rest_api_pg}
      PG_PORT: ${PG_PORT:-5432}
    ports:
      - "4000:4000"
    depends_on:
      rest_api_pg:
        condition: service_healthy
    networks:
      - rest_api_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
